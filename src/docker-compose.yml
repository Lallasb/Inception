
services:
  mariadb:
    build: ./requirements/mariadb/
    image: mariadb
    container_name: mariadb
    restart: always
    networks:
      - inception
    expose:
      - "3306"
    env_file:
      .env
    volumes:
     - mariadb:/var/lib/mysql

  nginx: 
    build: ./requirements/nginx/
    image: nginx
    container_name: nginx
    depends_on: 
     - wordpress
    restart: always
    networks:
      - inception
    ports:
      - 443:443
    expose:
      - "443"
    env_file:
      .env
    volumes:
    - wordpress:/var/www/wordpress
  
  
  wordpress:
    build: ./requirements/wordpress/
    image: wordpress
    container_name: wordpress
    depends_on:
      - mariadb
    restart: always
    networks:
      - inception 
    expose:
      - "9000"
    env_file:
      .env
    volumes:
     - wordpress:/var/www/wordpress


networks:
  inception:
    driver: bridge
    

volumes:
  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/login/data/wordpress
  mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/login/data/mariadb
  
